name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # Matrice : le job est lancé une fois par version listée (2 jobs)
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-python@v5
        with:
          # Chaque exécution reçoit sa propre version
          python-version: ${{ matrix.python-version }}

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm ci
        working-directory: node-app
      - name: Lancer les tests
        run: npm test
        working-directory: node-app

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler et tester
        run: mvn -B package
        working-directory: java-app
    
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: installer
        run: composer install --no-interaction
        working-directory: php-app

      - name: tester
        run: vendor/bin/phpunit tests
        working-directory: php-app
      # build ne démarre que si les 4 jobs de tests ont réussi
  build:
    needs: [python, node, java, php]
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Tous les tests sont passés, build en cours"

    # deploy démarre après build, et seulement sur la branche main
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement
        run: echo "Déploiement en cours"
      - name: Vérifier le secret
        # Le secret est passé dans une variable d'environnement
        # test -n vérifie qu'elle n'est pas vide, sans afficher sa valeur
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$TOKEN" && echo "Token présent"